<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>quoteGen</title>
        <link rel="stylesheet" href="/src/style.css" />
    </head>
    <body
        class="bg-zinc-800 text-zinc-300 min-h-screen grid place-items-center"
    >
        <main
            class="bg-zinc-700 w-full max-w-4xl min-h-fit rounded-sm shadow-2xl flex flex-col gap-y-2 px-6 sm:px-10 py-10 sm:py-20"
        >
            <div
                class="flex flex-col gap-3 py-10 justify-between"
                id="quoteDiv"
            >
                <blockquote
                    class="self-start text-xl sm:text-3xl pb-8 sm:pb-20"
                    id="quote"
                >
                    Quote Loading...
                </blockquote>
                <span class="self-end text-lg sm:text-xl" id="author">
                    Author Loading...
                </span>
            </div>
            <div
                class="flex flex-col sm:flex-row px-6 sm:px-10 items-center gap-3 sm:gap-6 justify-center"
            >
                <button
                    id="newQuote"
                    class="border border-zinc-300 p-2 px-5 rounded-full text-zinc-300 bg-zinc-700 hover:bg-zinc-600 active:bg-zinc-500 transition-colors duration-150 shadow-sm hover:shadow-md"
                >
                    New Quote
                </button>

                <button
                    id="copy-button"
                    class="border border-zinc-300 p-2 px-5 rounded-full text-zinc-300 bg-zinc-700 hover:bg-zinc-600 active:bg-zinc-500 transition-colors duration-150 shadow-sm hover:shadow-md"
                >
                    Copy Quote
                </button>
            </div>
        </main>
        <script src="/src/main.js" defer></script>
    </body>
</html>
